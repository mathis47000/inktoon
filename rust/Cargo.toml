[package]
name = "inktoon"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12.24", features = ["blocking", "rustls-tls","json"], default-features = false }
scraper = "0.25.0"
flutter_rust_bridge = "=2.11.1"
urlencoding = "2.1"
serde = { version = "1.0.228", features = ["derive"] }
zip = "0.6.0"
chrono = { version = "0.4.26", features = ["serde"] }
serde_json = "1.0.149"

[lib]
crate-type = ["cdylib", "staticlib"]
