[package]
name = "inktoon"
version = "0.1.0"
edition = "2021"

[dependencies]
# IMPORTANT: Utiliser rustls-tls au lieu de openssl
reqwest = { version = "0.12.24", features = ["blocking", "rustls-tls","json"], default-features = false }
scraper = "0.24.0"
flutter_rust_bridge = "=2.11.1"
urlencoding = "2.1"
serde = { version = "1.0.228", features = ["derive"] }

[lib]
crate-type = ["cdylib", "staticlib"]
