[package]
name = "inktoon"
version = "0.1.0"
edition = "2021"

[dependencies]
# IMPORTANT: Utiliser rustls-tls au lieu de openssl
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"], default-features = false }
scraper = "0.20"
flutter_rust_bridge = "=2.11.1"
urlencoding = "2.1"

[lib]
crate-type = ["cdylib", "staticlib"]
